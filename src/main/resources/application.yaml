spring:
  application:
    name: url-shortener

  # ── DataSource ──────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:url-shortener}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:thanh}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 5000

  # ── JPA / Hibernate ────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50             # Gom 50 INSERT thành 1 JDBC batch call
        order_inserts: true          # Sắp xếp INSERT theo entity type → batch hiệu quả hơn
        order_updates: true
    show-sql: false
    open-in-view: false

  # ── Flyway ─────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public,iam,link,analytics,platform,billing
    baseline-on-migrate: true

  # ── Redis ──────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms

  # ── Cache ──────────────────────────────────────────────
  # Dùng 'simple' (in-memory) khi chưa có Redis, chuyển sang 'redis' khi đã cài Redis
  cache:
    type: redis

  # ── Kafka ─────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: url-shortener-group
      auto-offset-reset: earliest
      # Batch consumer: gom tối đa 500 records trước khi xử lý
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ThanhND05.url_shortener.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# ── Server ─────────────────────────────────────────────
server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /

# ── App Custom Properties ─────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:url-shortener-jwt-secret-key-change-this-in-production-2026-thanhnd05}
    access-token-expiration-ms: 900000        # 15 phút
    refresh-token-expiration-ms: 604800000    # 7 ngày
  admin:
    super-admin-email: ${SUPER_ADMIN_EMAIL:superadmin@admin.com}
    super-admin-password: ${SUPER_ADMIN_PASSWORD:123456aA@}
    admin-email: ${ADMIN_EMAIL:admin@admin.com}
    admin-password: ${ADMIN_PASSWORD:123456aA@}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://url-shortener.thanhnd.vn}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:NZCRQJ6U}                  # Thay bằng mã từ VNPay Sandbox
    hash-secret: ${VNPAY_HASH_SECRET:Q4K67KVGHMSZK5DKM3RHXPEM2U185SHD}            # Thay bằng secret từ VNPay Sandbox
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: ${VNPAY_RETURN_URL:http://api-url-shortener.thanhnd.vn/api/v1/billing/vnpay-return}

# ── Logging ────────────────────────────────────────────
logging:
  level:
    com.ThanhND05.url_shortener: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO
