name: Backend Lab CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports: [9092:9092]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw verify -B
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: image
        shell: bash
        run: |
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned image without rebuilding
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: docker push "$IMAGE_REF"
      - name: Record digest
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF" > backend-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.txt
