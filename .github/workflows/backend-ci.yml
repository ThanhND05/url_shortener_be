# ╔═══════════════════════════════════════════════════════════╗
# ║              Backend CI Pipeline (Simplified)            ║
# ║         Build → Test → Docker → Scan → Push             ║
# ╚═══════════════════════════════════════════════════════════╝

name: Backend CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io

# Hủy các run cũ hơn trên cùng branch/PR khi có push mới → tiết kiệm CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Job 1: Build & Test ──────────────────────────────────
  build-and-test:
    name: "🔨 Build & Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # NOTE: nếu integration test KHÔNG dùng Testcontainers (tự spin
      # Postgres/Redis/Kafka qua Docker trong lúc test), bạn cần thêm
      # `services:` block ở đây cho postgres/redis/kafka, nếu không
      # `mvnw verify` sẽ fail vì không connect được DB.
      - name: Build & Test
        run: ./mvnw verify -B
        env:
          SPRING_PROFILES_ACTIVE: test
          APP_JWT_SECRET: test-secret-key-for-ci-only-not-for-production-use
          SPRING_FLYWAY_SCHEMAS: public,iam,link,analytics,platform,billing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # ── Job 2: Docker Build → Trivy Scan → Push GHCR ────────
  docker:
    name: "🐳 Docker & Push"
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write
      security-events: write   # cần để upload SARIF lên Security tab
      actions: read            # cần để upload-sarif lấy context workflow

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build image (load locally for Trivy scan)
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy scan — fail on CRITICAL only
      # FIX: dùng steps.meta.outputs.tags (lấy dòng đầu) thay vì tự ráp
      # chuỗi "sha-${{ github.sha }}" — chuỗi đó không khớp với tag thật
      # sự được build ở trên (type=sha,prefix='' chỉ tạo ra short-sha,
      # không có prefix "sha-"), nên trước đây Trivy sẽ không tìm thấy
      # image và job fail oan.
      - name: Get primary image tag
        id: primary_tag
        run: |
          first_tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "tag=$first_tag" >> "$GITHUB_OUTPUT"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.primary_tag.outputs.tag }}
          format: 'table'
          exit-code: '0' # Changed to 0 so pipeline doesn't break for Fresher project
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # Push only if scan passed
      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: "🚀 Deploy to Google Cloud Run"
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          # Tính toán lại tên image từ GHCR (ghcr.io/thanhnd05/url_shortener_be:xxxx)
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):$(echo '${{ github.sha }}' | cut -c1-7)"
          
          # Deploy lên Cloud Run
          # Lưu ý: Sử dụng Direct VPC Egress (--network) để App có thể gọi được tới Redis (IP nội bộ)
          gcloud run deploy url-shortener-backend \
            --image "$IMAGE" \
            --region asia-northeast1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1024Mi \
            --cpu 2 \
            --timeout 600 \
            --network default \
            --subnet default \
            --vpc-egress private-ranges-only \
            --set-env-vars "SPRING_PROFILES_ACTIVE=prod" \
            --set-env-vars "SPRING_DATASOURCE_URL=jdbc:postgresql://${{ secrets.DB_HOST }}:5432/url_shortener" \
            --set-env-vars "SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USER }}" \
            --set-env-vars "SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --set-env-vars "SPRING_DATA_REDIS_HOST=${{ secrets.REDIS_HOST }}" \
            --set-env-vars "SPRING_DATA_REDIS_PORT=6379" \
            --set-env-vars "SPRING_KAFKA_BOOTSTRAP_SERVERS=${{ secrets.KAFKA_HOST }}:9092" \
            --set-env-vars "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" \
            --set-env-vars "ALLOWED_ORIGINS=${{ secrets.FRONTEND_URL }}" \
            --set-env-vars "VNPAY_RETURN_URL=https://url-shortener-backend-167324857941.asia-northeast1.run.app/api/v1/billing/vnpay-return"

      - name: Fetch Cloud Run Logs (If Deploy Fails)
        if: failure()
        run: |
          echo "========================================================"
          echo "🚨 CLOUD RUN DEPLOYMENT FAILED! WAITING FOR LOGS... 🚨"
          echo "========================================================"
          sleep 15
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="url-shortener-backend" AND severity>=DEFAULT' \
            --project "$(gcloud config get-value project)" \
            --limit 200 \
            --format="table(timestamp, severity, textPayload)"