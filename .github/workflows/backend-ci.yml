# ╔═══════════════════════════════════════════════════════════╗
# ║              Backend CI Pipeline (Simplified)            ║
# ║         Build → Test → Docker → Scan → Push             ║
# ╚═══════════════════════════════════════════════════════════╝

name: Backend CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io

# Hủy các run cũ hơn trên cùng branch/PR khi có push mới → tiết kiệm CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Job 1: Build & Test ──────────────────────────────────
  build-and-test:
    name: "🔨 Build & Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # NOTE: nếu integration test KHÔNG dùng Testcontainers (tự spin
      # Postgres/Redis/Kafka qua Docker trong lúc test), bạn cần thêm
      # `services:` block ở đây cho postgres/redis/kafka, nếu không
      # `mvnw verify` sẽ fail vì không connect được DB.
      - name: Build & Test
        run: ./mvnw verify -B
        env:
          SPRING_PROFILES_ACTIVE: test
          APP_JWT_SECRET: test-secret-key-for-ci-only-not-for-production-use
          SPRING_FLYWAY_SCHEMAS: public,iam,link,analytics,platform,billing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # ── Job 2: Docker Build → Trivy Scan → Push GHCR ────────
  docker:
    name: "🐳 Docker & Push"
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write
      security-events: write   # cần để upload SARIF lên Security tab

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build image (load locally for Trivy scan)
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy scan — fail on CRITICAL only
      # FIX: dùng steps.meta.outputs.tags (lấy dòng đầu) thay vì tự ráp
      # chuỗi "sha-${{ github.sha }}" — chuỗi đó không khớp với tag thật
      # sự được build ở trên (type=sha,prefix='' chỉ tạo ra short-sha,
      # không có prefix "sha-"), nên trước đây Trivy sẽ không tìm thấy
      # image và job fail oan.
      - name: Get primary image tag
        id: primary_tag
        run: |
          first_tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "tag=$first_tag" >> "$GITHUB_OUTPUT"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.primary_tag.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0' # Changed to 0 so pipeline doesn't break for Fresher project
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # Luôn upload kết quả (kể cả khi scan fail) để xem chi tiết trong
      # tab Security > Code scanning thay vì chỉ đọc log text
      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # Push only if scan passed
      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max